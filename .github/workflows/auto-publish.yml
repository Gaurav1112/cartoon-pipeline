name: Auto Publish to YouTube

on:
  schedule:
    # 6:15 PM IST = 12:45 PM UTC, Mon/Wed/Fri
    - cron: '45 12 * * 1,3,5'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download rendered episodes
        uses: actions/download-artifact@v4
        with:
          name: rendered-episodes
          path: output/
        continue-on-error: true

      - name: Run auto-publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_HI: ${{ secrets.YOUTUBE_REFRESH_TOKEN_HI }}
          YOUTUBE_REFRESH_TOKEN_TE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TE }}
          YOUTUBE_REFRESH_TOKEN_TA: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TA }}
          YOUTUBE_REFRESH_TOKEN_KN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_KN }}
          YOUTUBE_REFRESH_TOKEN_MR: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MR }}
          YOUTUBE_REFRESH_TOKEN_BN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_BN }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
        run: npx tsx scripts/auto-publish.ts

      - name: Commit updated registry and queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/episode-registry.json config/publish-queue.json
          git diff --cached --quiet || git commit -m "chore: update registry after publish"
          git push
